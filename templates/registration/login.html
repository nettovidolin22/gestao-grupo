{% extends "base.html" %}
{% block titulo %}Entrar · Gestão do Grupo{% endblock %}
{% block conteudo %}
<div class="cartao cartao-login">
  <h1>Gestão do Grupo</h1>
  <p class="sutil">Entre com seu usuário ou e-mail corporativo e a senha.</p>
  {% for erro in form.non_field_errors %}<p class="erro">{{ erro }}</p>{% endfor %}
  <form method="post">
    {% csrf_token %}
    <label>Usuário ou e-mail <input type="text" name="username" autofocus required></label>
    <label>Senha <input type="password" name="password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="primario">Entrar</button>
  </form>
</div>
{% endblock %}
